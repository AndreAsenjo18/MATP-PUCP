# Points the API at its own database for the performance test (docs/rendimiento.md), so that the
# data in `matp` stays as it is. Use it on top of the main file:
#   docker compose -f docker-compose.yml -f scripts/perf/docker-compose.perf.yml ...
services:
  api:
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/matp_perf
