# MATP - entorno local completo (spec plataforma: entorno local reproducible).
# Uso: cp .env.example .env && npm run dev      (equivale a: docker compose up --build -d)
# Imágenes consultadas el 2026-09-17; ver docs/adr/ADR-003-herramientas-base.md.
name: matp

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB en .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql (not .../data).
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  storage:
    # MinIO dejó de publicar imágenes comunitarias y quay.io/minio/minio rechaza el pull anónimo
    # (401). pgsty/minio es un fork comunitario de terceros: solo para desarrollo local, fijado por
    # digest (RELEASE.2026-08-04T00-00-00Z) y con puertos solo en 127.0.0.1 (ADR-003).
    # Alternativas S3 compatibles (solo cambiar variables): rustfs/rustfs, dxflrs/garage.
    image: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD en .env}
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storage-data:/data
    healthcheck:
      # La imagen de MinIO incluye el cliente mc; "mc ready local" es su verificación recomendada.
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # La IA asistiva no tiene contenedor propio: corre dentro de este servicio, montada en /ai (ADR-008).
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_API_URL vacía = mismo origen (design D9): el navegador llama a /api/v1 y
      # las rewrites (fijadas en build time) o Caddy enrutan a la API. API_INTERNAL_URL es el
      # destino de las rewrites dentro de la imagen.
      args:
        NEXT_PUBLIC_API_MODE: ${NEXT_PUBLIC_API_MODE:-live}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      AI_MOUNT_PATH: ${AI_MOUNT_PATH:-/ai}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  db-data:
  storage-data:
