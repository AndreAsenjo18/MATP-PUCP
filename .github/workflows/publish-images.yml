# Publicación de imágenes tras cada merge a main (change pipeline-despliegue-ambientes, design D2).
# Se dispara cuando termina el workflow «CI» de un push a main y solo publica si terminó con éxito:
# depende de la conclusión del workflow completo, así que cualquier job que se añada a ci.yml pasa
# a ser requisito sin tocar este archivo. El ambiente de pruebas toma la imagen `main` por pull
# (D3); producción nunca se despliega desde aquí (D4).
# Nota: `workflow_run` solo ejecuta la versión de este archivo que está en la rama por defecto.
name: Publicar imágenes

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    name: Imagen ${{ matrix.image }}
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: matp-api
            dockerfile: apps/api/Dockerfile
          - image: matp-web
            dockerfile: apps/web/Dockerfile
    env:
      COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # GHCR exige nombres en minúsculas y el propietario del repositorio puede tenerlas.
      - name: Nombre de la imagen
        id: name
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            GIT_SHA=${{ env.COMMIT }}
          tags: |
            ${{ steps.name.outputs.ref }}:sha-${{ env.COMMIT }}
            ${{ steps.name.outputs.ref }}:main
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Resumen
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo ""
            echo "- Commit: \`${COMMIT}\`"
            echo "- Etiquetas: \`sha-${COMMIT}\`, \`main\`"
          } >> "$GITHUB_STEP_SUMMARY"
